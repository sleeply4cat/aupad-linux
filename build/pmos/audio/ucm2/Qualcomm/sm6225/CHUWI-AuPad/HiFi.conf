SectionVerb {
	Value {
		TQ "HiFi"
	}
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]
}

# Volume stays in software: the HPHL/HPHR gain has a wrong dB scale, and the digital gain reaches +40 dB.
# Headphones and the headset mic come back from ../HiFi-with-jack.conf (in the repo) once
# the jack ribbon is reconnected: it reports false plug events and turns the speakers off.
# Speakers hang off the HPH outputs through the two amps.
SectionDevice."Speaker" {
	Comment "Speakers"

	Include.wcdhpe.File "/codecs/wcd937x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd937x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	EnableSequence [
		cset "name='Speakers Switch' 1"
	]
	DisableSequence [
		cset "name='Speakers Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

# AMIC1.  Stock uses DEC2, but capture here only runs from DEC0.
SectionDevice."Mic1" {
	Comment "Internal Mic"

	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC4"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC1"
	}
}
