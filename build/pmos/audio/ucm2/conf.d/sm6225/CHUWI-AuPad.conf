Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm6225/CHUWI-AuPad/HiFi.conf"
	Comment "HiFi quality Music"
}

# Digital gain stays 14 dB under stock: a full-scale signal at 0 dB is painfully loud.
BootSequence [
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='RX_RX0 Digital Volume' 70"
	cset "name='RX_RX1 Digital Volume' 70"
	cset "name='RX_COMP1 Switch' 0"
	cset "name='RX_COMP2 Switch' 0"
	cset "name='ADC1 Volume' 3"
	cset "name='ADC2 Volume' 6"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd937x/init.conf"
