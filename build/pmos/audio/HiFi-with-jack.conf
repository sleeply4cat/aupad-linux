SectionVerb {
	Value {
		TQ "HiFi"
	}
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]
}

# Volume stays in software: the HPHL/HPHR gain has a wrong dB scale, and the digital gain reaches +40 dB.
# No JackControl and low priorities while the jack ribbon is disconnected: it reports false
# plug events and PulseAudio then turns the speakers off.  Restore both once it's reconnected.
# Speakers hang off the HPH outputs through the two amps.
SectionDevice."Speaker" {
	Comment "Speakers"

	Include.wcdhpe.File "/codecs/wcd937x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd937x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='Speakers Switch' 1"
	]
	DisableSequence [
		cset "name='Speakers Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	Include.wcdhpe.File "/codecs/wcd937x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd937x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Headphone Jack Switch' 1"
	]
	DisableSequence [
		cset "name='Headphone Jack Switch' 0"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
	}
}

# AMIC1.  Stock uses DEC2, but capture here only runs from DEC0.
SectionDevice."Mic1" {
	Comment "Internal Mic"

	ConflictingDevice [
		"Mic2"
	]

	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC4"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC1"
	}
}

# AMIC2.
SectionDevice."Mic2" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic1"
	]

	EnableSequence [
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2 Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC5"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='Mic Jack Switch' 1"
	]
	DisableSequence [
		cset "name='Mic Jack Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
	]

	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC2"
	}
}
