# SM6225 (khaje) over EUD SWD.  Stub with -DSTUB_EUD has to be running.
# AP3 is the RPM's Cortex-M3.  Never use SRST here: it left the tablet in EDL.
source [find interface/eud-swd.cfg]

# Runs in the target that lost GDB.  Each step can fail: GDB may have died with the target running.
proc detached {} {
	catch {rbp all}
	catch {rwp all}
	catch {resume}
}

reset_config none
adapter speed 7500
swd newdap khaje dap -enable
dap create khaje.dap -tap khaje.dap
target create rpm cortex_m -dap khaje.dap -ap-num 3
rpm configure -event examine-fail { echo "rpm examine failed" }
# GDB's detach leaves a target halted otherwise.  A halted RPM fails Linux's power requests, UFS dies with -110.
rpm configure -event gdb-detach { detached }

# Kryo cores share AP1.  Examine one only while it's awake, its debug block is powered down in idle.
for {set i 0} {$i < 8} {incr i} {
	cti create cti$i -dap khaje.dap -ap-num 1 -baseaddr [expr {0x09020000 + $i * 0x100000}]
	target create cpu$i aarch64 -dap khaje.dap -ap-num 1 -dbgbase [expr {0x09010000 + $i * 0x100000}] \
		-cti cti$i -coreid $i -rtos hwthread -defer-examine
	cpu$i configure -event gdb-detach { detached }
}
target smp cpu0 cpu1 cpu2 cpu3 cpu4 cpu5 cpu6 cpu7
targets rpm

# Run before connecting GDB to 3334, which shows all 8 cores as threads.  tools/ocd/g does this.
proc kryo {} {
	for {set i 0} {$i < 8} {incr i} {
		cpu$i arp_examine
	}
}

# The EL1 state GDB doesn't get: sysregs N, core halted.  From GDB too, where monitor doesn't follow `thread`.
proc sysregs {cpu} {
	foreach {name enc} {
		VBAR_EL1 {3 0 12 0 0}  SCTLR_EL1 {3 0 1 0 0}  TCR_EL1 {3 0 2 0 2}  MAIR_EL1 {3 0 10 2 0}
		TTBR0_EL1 {3 0 2 0 0}  TTBR1_EL1 {3 0 2 0 1}  ESR_EL1 {3 0 5 2 0}  FAR_EL1 {3 0 6 0 0}
		ELR_EL1 {3 0 4 0 1}  SP_EL0 {3 0 4 1 0}  MPIDR_EL1 {3 0 0 0 5}  MIDR_EL1 {3 0 0 0 0}
	} {
		echo "$name [cpu$cpu aarch64 mrs {*}$enc]"
	}
}

# Kernel text is read-only, a software breakpoint there aborts, and GDB plants them itself for finish and until.
gdb breakpoint_override hard
gdb port 3333
telnet port 4444
tcl port 6666
